    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
      if (window.Vimeo) {
        document.querySelectorAll(".project-media-grid__video").forEach((videoModule) => {
          const iframe = videoModule.querySelector("iframe");
          const toggle = videoModule.querySelector(".project-media-grid__video-toggle");
          const player = new Vimeo.Player(iframe);

          const updateToggle = (isPlaying) => {
            toggle.dataset.playing = String(isPlaying);
            toggle.setAttribute("aria-label", isPlaying ? "Pause video" : "Start video");
          };

          player.on("play", () => updateToggle(true));
          player.on("pause", () => updateToggle(false));
          player.on("ended", () => updateToggle(false));

          toggle.addEventListener("click", async () => {
            toggle.disabled = true;
            try {
              if (await player.getPaused()) {
                await player.play();
              } else {
                await player.pause();
              }
            } catch (error) {
              console.error("Unable to toggle Vimeo playback:", error);
            } finally {
              toggle.disabled = false;
            }
          });
        });
      }
    </script>
